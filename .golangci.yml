version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - gocyclo
    - misspell
    - unconvert
    - dupl
    - gosec
  settings:
    gocyclo:
      min-complexity: 50  # High threshold: authenticate() has complex but linear cache/auth/otp branching
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam         # Passing styles by value is idiomatic in Lip Gloss
        - evalOrder         # Defer expressions are intentionally evaluated at defer time
    gosec:
      excludes:
        - G101 # Hardcoded credentials - false positives in test fixtures and GraphQL mutations
        - G104 # Audit errors not checked - we'll handle explicitly
        - G115 # Integer overflow conversion - false positive on term.IsTerminal(int(os.Stdin.Fd()))
        - G117 # Marshaled field matches secret pattern - intentional credential caching
        - G304 # File inclusion via variable - paths are from config, not user input
        - G602 # Slice bounds - already guarded by len checks

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
